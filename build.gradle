plugins {
    id 'java'
    id 'war'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.practicum.yandex'
version = ''

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework:spring-core'
    implementation 'org.springframework:spring-webmvc'
    implementation 'org.springframework:spring-jdbc'

    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.core:jackson-core'
    implementation 'com.fasterxml.jackson.core:jackson-annotations'
    implementation 'org.postgresql:postgresql'

    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'org.apache.commons:commons-collections4:4.5.0'
    implementation 'org.apache.tika:tika-core:3.2.3'
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'
    implementation 'ch.qos.logback:logback-classic:1.5.32'
    implementation 'jakarta.servlet:jakarta.servlet-api:6.1.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation platform('org.testcontainers:testcontainers-bom:2.0.4')
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.springframework:spring-test'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'org.hamcrest:hamcrest:2.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencyManagement {
    dependencies {
        dependency 'org.springframework:spring-core:6.2.11'
        dependency 'org.springframework:spring-webmvc:6.2.11'
        dependency 'org.springframework:spring-jdbc:6.2.11'
        dependency 'org.springframework:spring-test:6.2.11'
        dependency 'com.fasterxml.jackson.core:jackson-core:2.20.0'
        dependency 'org.postgresql:postgresql:42.6.0'
        dependency 'org.projectlombok:lombok:1.18.30'
        dependency 'org.junit.jupiter:junit-jupiter-api:6.0.0'
    }
}


tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
